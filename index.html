<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joshua - Web Designer</title>
<style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .card {
    background: white;
    border-radius: 24px;
    padding: 40px 30px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  
  .profile-img {
    width: 160px;
    height: 200px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 20px;
    display: block;
    border: 5px solid #f0f0f0;
    box-shadow: 0 8px 20px rgba(102,126,234,0.4);
  }
  
  h1 {
    font-size: 32px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .tagline {
    color: #666;
    font-size: 15px;
    margin-bottom: 25px;
    line-height: 1.5;
  }
  
  h2 {
    font-size: 20px;
    margin: 25px 0 15px;
    color: #333;
  }
  
  ul {
    list-style: none;
    text-align: left;
    display: inline-block;
    margin: 0 auto 20px;
  }
  
  li {
    font-size: 16px;
    margin: 10px 0;
    color: #444;
  }
  
  .price {
    font-size: 24px;
    font-weight: 700;
    color: #764ba2;
    margin: 20px 0;
  }
  
  .button {
    display: inline-block;
    background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
    color: white;
    padding: 16px 40px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    font-size: 17px;
    margin-top: 10px;
    box-shadow: 0 8px 20px rgba(37,211,102,0.4);
    transition: transform 0.2s;
  }
  
  .button:active {
    transform: scale(0.95);
  }
  
  .footer {
    margin-top: 25px;
    font-size: 13px;
    color: #999;
  }
</style>
</head>
<body>

<div class="card">
  <img src="profile.jpg" alt="Joshua" class="profile-img">
  
  <h1>Hi, I'm Joshua</h1>
  <p class="tagline">I build fast, affordable websites for small businesses.</p>
  
  <h2>What I Make:</h2>
  <ul>
    <li>✅ Business Websites</li>
    <li>✅ AI Chatbots for WhatsApp</li>
    <li>✅ Simple Web Apps</li>
  </ul>
  
  <p class="price">Starting at ₹799 only</p>
  
  <a href="https://wa.me/7629059055?text=Hi%20Joshua%2C%20I%20want%20a%20website" class="button">Chat Now on WhatsApp</a>
  
  <p class="footer">100% Mobile Friendly | Delivered in 24 hours</p>
</div>

<script>
  document.addEventListener('contextmenu', event => event.preventDefault());
</script>

</body>
</html>
